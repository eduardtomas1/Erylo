name: Continuous verification

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

# GitHub starts with no token access. Each job grants checkout-only access.
permissions: {}

concurrency:
  group: verification-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository-controls:
    name: Repository controls
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify repository hygiene
        run: |
          .github/scripts/check-repository.sh
          .github/scripts/test-check-repository.sh

  swift-build:
    name: Swift build
    # macos-14 defaults to Swift 5.10; the package is intentionally Swift 6.
    # The deployment target remains macOS 14 in Package.swift.
    runs-on: macos-15
    timeout-minutes: 14
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build every product with warnings as errors
        run: .github/scripts/run-ci-shard.sh build

  api-surface:
    name: API surface
    runs-on: macos-15
    timeout-minutes: 14
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify public API boundaries
        run: .github/scripts/run-ci-shard.sh api-surface

  target:
    name: PR target / ${{ matrix.target }}
    runs-on: macos-15
    timeout-minutes: 14
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        target:
          - EryloActivityTests
          - EryloFoundationTests
          - EryloFileHoldTests
          - EryloGlanceTests
          - EryloMediaTests
          - EryloTrustTests
          - EryloIntegrationTests
          - EryloSurfaceTests
          - EryloUpdateTests
          - EryloAppRuntimeTests
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run ${{ matrix.target }}
        if: matrix.target != 'EryloSurfaceTests' && matrix.target != 'EryloTrustTests'
        run: .github/scripts/run-ci-shard.sh target "${{ matrix.target }}"

      - name: Run EryloTrustTests and render native settings QA
        if: matrix.target == 'EryloTrustTests'
        env:
          ERYLO_SETTINGS_VISUAL_QA_DIRECTORY: ${{ runner.temp }}/erylo-native-settings-visual-qa
        run: |
          .github/scripts/run-ci-shard.sh target "${{ matrix.target }}"
          shopt -s nullglob
          settings_visual_files=("$ERYLO_SETTINGS_VISUAL_QA_DIRECTORY"/*.png)
          if (( ${#settings_visual_files[@]} != 5 )); then
            echo "Expected exactly 5 native settings QA images; found ${#settings_visual_files[@]}." >&2
            exit 1
          fi
          expected_settings_visual_names=(
            erylo-onboarding-dark.png
            erylo-onboarding-light.png
            erylo-settings-dark.png
            erylo-settings-lower-light.png
            erylo-settings-light.png
          )
          actual_settings_visual_names=()
          for path in "${settings_visual_files[@]}"; do
            actual_settings_visual_names+=("${path##*/}")
          done
          if ! diff -u \
            <(printf '%s\n' "${expected_settings_visual_names[@]}" | sort) \
            <(printf '%s\n' "${actual_settings_visual_names[@]}" | sort); then
            echo "Native settings QA manifest does not match the required fixtures." >&2
            exit 1
          fi

      - name: Run EryloSurfaceTests and render native visual QA
        if: matrix.target == 'EryloSurfaceTests'
        env:
          ERYLO_VISUAL_QA_DIRECTORY: ${{ runner.temp }}/erylo-native-visual-qa
        run: |
          .github/scripts/run-ci-shard.sh target "${{ matrix.target }}"
          shopt -s nullglob
          surface_visual_files=("$ERYLO_VISUAL_QA_DIRECTORY"/*.png)
          if (( ${#surface_visual_files[@]} != 16 )); then
            echo "Expected exactly 16 native surface QA images; found ${#surface_visual_files[@]}." >&2
            exit 1
          fi
          expected_surface_visual_names=(
            erylo-battery-notched.png
            erylo-charging-notchless.png
            erylo-generic-peek-notched.png
            erylo-queued-action-expanded-notched.png
            erylo-timer-compact.png
            erylo-timer-completion.png
            erylo-timer-expanded-light-desktop.png
            erylo-timer-expanded.png
            erylo-timer-launcher.png
            erylo-timer-launcher-notchless.png
            erylo-volume-muted-notched.png
            erylo-volume-muted-notchless.png
            erylo-volume-unmuted-notched.png
            erylo-volume-output-notched.png
            erylo-volume-output-notchless-light.png
            erylo-volume-output-notchless.png
          )
          actual_surface_visual_names=()
          for path in "${surface_visual_files[@]}"; do
            actual_surface_visual_names+=("${path##*/}")
          done
          if ! diff -u \
            <(printf '%s\n' "${expected_surface_visual_names[@]}" | sort) \
            <(printf '%s\n' "${actual_surface_visual_names[@]}" | sort); then
            echo "Native surface QA manifest does not match the required fixtures." >&2
            exit 1
          fi

      - name: Upload native visual QA
        if: ${{ !cancelled() && matrix.target == 'EryloSurfaceTests' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: erylo-native-visual-qa-${{ github.sha }}-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/erylo-native-visual-qa/*.png
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
          overwrite: false

      - name: Upload native settings visual QA
        if: ${{ !cancelled() && matrix.target == 'EryloTrustTests' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: erylo-native-settings-visual-qa-${{ github.sha }}-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/erylo-native-settings-visual-qa/*.png
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
          overwrite: false
